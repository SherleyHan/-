# 默认 dev profile 使用 H2（兼容 PostgreSQL 模式）
spring.datasource.url=jdbc:h2:mem:mextdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 初始化 schema 与数据
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data-dev.sql
spring.jpa.defer-datasource-initialization=true

# H2 控制台（开发用）
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 日志
logging.level.jp.go.mext=DEBUG
