spring.application.name=mext-survey-system

# ============ Profile 默认值（被 -Dspring.profiles.active 覆盖） ============
spring.profiles.active=dev

# ============ MyBatis ============
mybatis.mapper-locations=classpath:mybatis/**/*.xml
mybatis.type-aliases-package=jp.go.mext.dto

# ============ JSP 视图解析 ============
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# ============ 文件上传 ============
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ============ Server ============
server.port=8080
server.servlet.session.timeout=30m

# ============ 应用自定义配置 ============
mext.upload.temp-dir=${java.io.tmpdir}/mext-uploads
mext.mail.folder=${java.io.tmpdir}/mext-mail
mext.login.max-retry=5
mext.password.salt=mext2026
